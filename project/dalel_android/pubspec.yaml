name: dalel
description: وين في؟ — دليل الخدمات اليومية (تطبيق أندرويد مطابق لموقع الدليل)
publish_to: 'none'
version: 1.4.1+7

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # الشبكة
  http: ^1.2.2
  connectivity_plus: ^6.0.5

  # التخزين المحلي
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.3
  path: ^1.9.0
  shared_preferences: ^2.3.0

  # إدارة الحالة
  provider: ^6.1.2

  # واجهة
  lucide_icons: ^0.257.0
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_staggered_animations: ^1.1.1

  # تحديث التطبيق من داخل التطبيق
  package_info_plus: ^8.0.2   # قراءة رقم الإصدار المثبَّت
  path_provider: ^2.1.4       # مجلد تنزيل الملف
  open_filex: ^4.5.0          # فتح مثبّت أندرويد على الملف
  crypto: ^3.0.5              # التحقق من بصمة الملف المُنزَّل

  # أدوات
  url_launcher: ^6.3.0
  intl: ^0.19.0
  flutter_slidable: ^3.1.0
  pull_to_refresh: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
