plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// ─── توقيع الإصدار ───────────────────────────────────────────────
// android/key.properties (لا يُرفع إلى Git — يُنشأ من أسرار GitHub Actions):
//   storeFile=../dalel-release.jks
//   storePassword=…
//   keyAlias=dalel
//   keyPassword=…
def keystorePropsFile = rootProject.file("key.properties")
def keystoreProps = new Properties()
def hasReleaseKey = keystorePropsFile.exists()
if (hasReleaseKey) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace = "com.winfeen.dalel"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = "27.0.12077973"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.winfeen.dalel"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 23
        targetSdk = 34
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    // تُعرَّف تهيئة الإصدار فقط عند وجود المفتاح — لا تهيئة فارغة
    if (hasReleaseKey) {
        signingConfigs {
            release {
                keyAlias = keystoreProps['keyAlias']
                keyPassword = keystoreProps['keyPassword']
                storeFile = file(keystoreProps['storeFile'])
                storePassword = keystoreProps['storePassword']
            }
        }
    }

    buildTypes {
        release {
            // مفتاح إصدار حقيقي إن وُجد (android/key.properties + ملف .jks)،
            // وإلا مفاتيح التصحيح — كي يعمل `flutter build apk` مباشرةً.
            //
            // ⚠️ تثبيت تحديث فوق نسخة قديمة يتطلّب **نفس مفتاح التوقيع دائماً**؛
            //    فإن بنيت نسخة بمفاتيح التصحيح ثم نسخة بمفتاح إصدار، لن يقبل
            //    أندرويد التحديث وسيطلب إزالة التطبيق أولاً.
            signingConfig = hasReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
