name: بناء APK

# ═══════════════════════════════════════════════════════════════
#  بناء حزمة أندرويد (APK) جاهزة للنشر — على خوادم GitHub مجاناً
#
#  كيف تشغّله؟
#    GitHub → تبويب «Actions» → «بناء APK» → زر «Run workflow»
#    اترك الحقول فارغة ليُبنى الإصدار الموجود في pubspec.yaml،
#    أو اكتب اسم الإصدار ورقم البناء لبناء إصدار جديد فوراً.
#
#  الناتج:
#    • ملف APK جاهز للتنزيل من صفحة التشغيل (Artifacts)
#    • ملف build-info.txt فيه الاسم والحجم وبصمة SHA-256
#    • رابط تحميل عام دائم إن اخترتَ «إنشاء إصدار GitHub»
#
#  المدة (مقيسة فعلاً): أول تشغيل ~٦–٩ دقائق (تنزيل Flutter)، وبعده ~٤–٥ دقائق
#  بفضل التخزين المؤقت لـ Flutter وGradle وPub.
# ═══════════════════════════════════════════════════════════════

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'اسم الإصدار — مثال: 1.2.0   (فارغ = من pubspec.yaml)'
        required: false
        default: ''
      version_code:
        description: 'رقم البناء — يجب أن يزيد في كل إصدار، مثال: 3   (فارغ = من pubspec.yaml)'
        required: false
        default: ''
      server_url:
        description: 'عنوان الخادم الذي يخاطبه التطبيق'
        required: false
        # الإنتاج /dalel هو الافتراضي الآن (٤٠٥ خدمة · ٦ أقسام).
        # لبناء نسخة تجريبية على مسار الاختبار اكتب https://t3lam.site/daleltest
        default: 'https://t3lam.site/dalel'
      build_type:
        description: 'نوع البناء'
        required: true
        default: release
        type: choice
        options:
          - release
          - debug
      arch:
        description: 'معمارية المعالج — arm64 هي نسخة 64 بت (الأكثر شيوعاً)'
        required: true
        # نسخة 64 بت افتراضياً كما طُلب — وهي المطلوبة لمتجر Google Play.
        # universal ملف واحد يعمل على كل الأجهزة (ويشمل 64 بت).
        default: arm64
        type: choice
        options:
          - arm64
          - universal
          - arm32
          - x64
      publish_release:
        description: 'إنشاء «إصدار GitHub» مع الملف (يعطي رابط تحميل عام دائم)'
        required: false
        type: boolean
        default: false
      release_tag:
        description: 'اسم الوسم للإصدار — مثال: v1.2.0 (مع الخيار أعلاه)'
        required: false
        default: ''
      flutter_version:
        description: 'إصدار Flutter (فارغ = الافتراضي المضبوط)'
        required: false
        default: ''

  # بناء تلقائي عند تغيير كود التطبيق على الفرع الرئيسي
  # (يبقى الملف جاهزاً دائماً بلا انتظار طلب، والباقي عند الطلب من الزر)
  push:
    branches:
      - main
      - 'arena/**'   # مؤقّت: زر Run workflow ممنوع على توكن الجلسة (403)
    paths:
      - 'project/dalel_android/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

# تشغيل واحد لكل فرع — يُلغي التشغيل السابق الجاري
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: ${{ inputs.flutter_version || '3.27.4' }}
  APP_DIR: project/dalel_android

# ملاحظة: أسطر الخطأ المفيدة تُعلَن كتعليقات (::error) في واجهة Actions
# بدل دفنها في سجل طويل — يراها المدير مباشرةً في صفحة التشغيل.

jobs:
  # ═══════════════════════════════════════════════════════════
  #  الفحص — يعمل بالتوازي ولا يمنع البناء (تقرير فقط)
  # ═══════════════════════════════════════════════════════════
  verify:
    name: الفحص والاختبارات
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: تنزيل الحزم
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      - name: تحليل الكود
        working-directory: ${{ env.APP_DIR }}
        run: |
          set +e
          flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings 2>&1 | tee /tmp/analyze.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            {
              echo "::group::نتيجة التحليل"
              tail -n 40 /tmp/analyze.log
              echo "::endgroup::"
            }
            grep -nE '^ *error|error •|error -' /tmp/analyze.log | tail -n 8 | while IFS= read -r l; do
              echo "::error title=فشل التحليل::$l"
            done
            exit "$rc"
          fi
          tail -n 3 /tmp/analyze.log

      - name: الاختبارات
        working-directory: ${{ env.APP_DIR }}
        run: |
          set +e
          flutter test --no-pub --reporter expanded 2>&1 | tee /tmp/test.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            {
              echo "::group::الاختبارات الفاشلة (تفاصيل)"
              awk '
                /\[E\]$/ {in_fail=1; n++; print ""; print "══ فشل #" n " ══"; print; next}
                in_fail && /^[0-9][0-9]:[0-9][0-9] / {in_fail=0}
                in_fail && /Expected|Actual|Which|EXCEPTION|reason|Where|The relevant error|^ *error/ {print}
              ' /tmp/test.log
              echo "::endgroup::"
            }
            # ─── أهم ما يلزم للتشخيص أولاً ───
            # سقف التعليقات (::error) عشر لكل خطوة. نُصرفها على **ملخّص كل
            # اختبار ساقط**: اسمه + سطر المتوقّع/الواقعي + سطر الودجة المتسبّبة.
            # التعليق الواحد يحمل عدة أسطر، فلا تُهدر الحصة على الترويسات.
            # ملاحظة: Flutter يطبع تفاصيل الاستثناء **قبل** سطر [E]، فنقرأ
            # الخمسين سطراً السابقة للسطر الفاشل لا التالية له.
            grep -nE '\[E\]$' /tmp/test.log | head -n 5 | cut -d: -f1 | while IFS= read -r ln; do
              name=$(sed -n "${ln}p" /tmp/test.log | cut -c1-200)
              body=$(awk -v n="$ln" 'NR>=n-55 && NR<=n' /tmp/test.log \
                | grep -aE 'Expected:|Actual:|Which:|reason|error-causing widget|was thrown|overflowed by|but the constraints|\.dart:[0-9]+:[0-9]+' \
                | head -n 5 | sed 's/^[ \t]*//' | paste -sd ' ⟶ ' - | cut -c1-800)
              echo "::error title=اختبار ساقط :: $name ⟶ $body"
            done

            # ما زاد عن السقف يُطبع في السجل وحده (بلا ::error كي لا يُهدر السقف)
            grep -nA 3 -E 'EXCEPTION CAUGHT|was thrown|^Expected:|^ *Actual:|^ *Which:|^The following' /tmp/test.log \
              | tail -n 30 | sed 's/^/  سجل: /'

            # ─── تشخيص مركّز ───
            # اسم الاختبار الفاشل (عدّاد الفشل -N) + الودجة المتسبّبة + سطرها في
            # المصدر — كي لا تضيع تفاصيل التخطيط في ذيل السجل.
            {
              echo "::group::الاختبارات التي سقطت"
              grep -nE '^[0-9]{2}:[0-9]{2} \+[0-9]+ -[0-9]+' /tmp/test.log | cut -c1-300
              echo "::endgroup::"
            }
            grep -nE '\[E\]|RenderFlex overflowed|A RenderFlex|overflowed by' /tmp/test.log \
              | tail -n 20 | sed 's/^/  سجل: /'

            # لكل اختبار فاشل: سطر واحد مضغوط يحمل السبب كاملاً (يظهر في واجهة Actions)
            awk '
              BEGIN { buf=""; infail=0 }
              /\[E\]$/ {
                if (infail && buf != "") print buf;
                infail=1; buf=$0;
                sub(/^[0-9:]+ \+[0-9]+ -[0-9]+: /, "", buf);
                sub(/ \[E\]$/, "", buf);
                next
              }
              infail && /^[0-9][0-9]:[0-9][0-9] / { if (buf != "") print buf; buf=""; infail=0 }
              infail {
                l=$0; gsub(/^[ \t]+|[ \t]+$/, "", l);
                # index() مقارنة نصية — لتفادي أن يُفسَّر النص كتعبير نمطي
                if (l != "" && index(buf, l) == 0) buf = buf " » " l
              }
              END { if (infail && buf != "") print buf }
            ' /tmp/test.log | head -n 12 | sed 's/^/  سجل: /'
            exit "$rc"
          fi
          grep -E 'All tests passed|\+[0-9]+:' /tmp/test.log | tail -n 2

  # ═══════════════════════════════════════════════════════════
  #  البناء — يُنتج ملف APK
  # ═══════════════════════════════════════════════════════════
  build:
    name: بناء الحزمة
    runs-on: ubuntu-latest
    env:
      # تُقرأ على مستوى المهنة كي تستطيع شرطُ الخطوة رؤيتها
      # (سياق secrets لا يُتاح داخل if مباشرةً)
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: إعداد Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # تخزين مؤقت لـ Gradle (يشمل توزيعة Gradle والاعتماديات)
      - name: تخزين Gradle مؤقتاً
        uses: gradle/actions/setup-gradle@v4

      # تخزين مؤقت لـ Flutter SDK (الأكبر — يُوفّر دقائق)
      - name: إعداد Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: تخزين حزم Dart مؤقتاً
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('project/dalel_android/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: معلومات البيئة
        run: |
          echo "Flutter: $(flutter --version | head -1)"
          java -version 2>&1 | head -1

      - name: تنزيل الحزم
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      # ─── تحديد رقم الإصدار ───
      - name: تحديد الإصدار
        id: ver
        working-directory: ${{ env.APP_DIR }}
        env:
          IN_NAME: ${{ inputs.version_name }}
          IN_CODE: ${{ inputs.version_code }}
          IN_TYPE: ${{ inputs.build_type }}
          IN_URL: ${{ inputs.server_url }}
          IN_ARCH: ${{ inputs.arch }}
        run: |
          set -e
          DEF=$(grep -m1 '^version:' pubspec.yaml | sed 's/^version:[[:space:]]*//')
          DEF_NAME="${DEF%%+*}"
          DEF_CODE="${DEF##*+}"
          [ "$DEF_CODE" = "$DEF_NAME" ] && DEF_CODE=1

          NAME="${IN_NAME:-$DEF_NAME}"
          CODE="${IN_CODE:-$DEF_CODE}"
          TYPE="${IN_TYPE:-release}"
          URL="${IN_URL:-https://t3lam.site/dalel}"

          # تحقق مبكّر برسالة واضحة بدل فشل غامض في Gradle
          case "$CODE" in
            ''|*[!0-9]*) echo "::error::رقم البناء يجب أن يكون رقماً صحيحاً (وصل: '$CODE')"; exit 1 ;;
          esac
          case "$NAME" in
            [0-9]*.[0-9]*) ;;
            *) echo "::error::اسم الإصدار يجب أن يبدأ بأرقام مثل 1.2.0 (وصل: '$NAME')"; exit 1 ;;
          esac
          case "$URL" in
            https://*|http://*) ;;
            *) echo "::error::عنوان الخادم يجب أن يبدأ بـ https:// (وصل: '$URL')"; exit 1 ;;
          esac

          # ── المعمارية: ما يُمرَّر لـFlutter وما يُتوقَّع من اسم المخرَج ──
          ARCH="${IN_ARCH:-arm64}"
          case "$ARCH" in
            arm64)     ABIFLAG="--target-platform android-arm64"; ABI_FILE="arm64-v8a"   ;;
            arm32)     ABIFLAG="--target-platform android-arm";   ABI_FILE="armeabi-v7a" ;;
            x64)       ABIFLAG="--target-platform android-x64";   ABI_FILE="x86_64"      ;;
            universal) ABIFLAG="";                                ABI_FILE=""            ;;
            *) echo "::error::معمارية غير معروفة: '$ARCH'"; exit 1 ;;
          esac

          {
            echo "name=$NAME"
            echo "code=$CODE"
            echo "type=$TYPE"
            echo "url=$URL"
            echo "arch=$ARCH"
            echo "abiflag=$ABIFLAG"
            echo "abifile=$ABI_FILE"
            echo "apk=dalel-$NAME-$CODE-$ARCH.apk"
          } >> "$GITHUB_OUTPUT"

          echo "الإصدار: $NAME ($CODE) · النوع: $TYPE · الخادم: $URL"

      # ─── توقيع الإصدار من الأسرار (إن وُجدت) ───
      - name: تجهيز مفتاح التوقيع (اختياري)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        working-directory: ${{ env.APP_DIR }}/android
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > dalel-release.jks
          cat > key.properties <<EOF
          storeFile=../dalel-release.jks
          storeType=PKCS12
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=${KEY_ALIAS:-dalel}
          keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}
          EOF
          echo "✅ سيُوقَّع الإصدار بمفتاح حقيقي"

      - name: تنبيه إن لم يوجد مفتاح توقيع
        if: ${{ env.KEYSTORE_BASE64 == '' }}
        run: |
          echo "::warning title=توقيع التصحيح::لا يوجد مفتاح إصدار — سيُوقَّع الملف بمفاتيح التصحيح. التحديثات التلقائية تحتاج نفس مفتاح التوقيع دائماً؛ أضف KEYSTORE_BASE64 في أسرار المستودع قبل التوزيع الجدّي."

      - name: أسباب محتملة قبل البناء (تشخيص)
        if: always()
        working-directory: ${{ env.APP_DIR }}
        run: |
          echo "── إصدارات البناء ──"
          flutter --version
          grep -E 'distributionUrl' android/gradle/wrapper/gradle-wrapper.properties || true
          grep -E 'com.android.application' android/settings.gradle || true
          grep -E 'ndkVersion|compileSdk|signingConfig' android/app/build.gradle || true
          ls "$ANDROID_HOME/ndk" 2>/dev/null || echo "لا يوجد أي NDK مثبّت"

      - name: بناء الحزمة
        id: apk
        working-directory: ${{ env.APP_DIR }}
        run: |
          set +e
          flutter build apk --${{ steps.ver.outputs.type }} \
            ${{ steps.ver.outputs.abiflag }} \
            --build-name="${{ steps.ver.outputs.name }}" \
            --build-number="${{ steps.ver.outputs.code }}" \
            --dart-define=DALEL_BASE_URL="${{ steps.ver.outputs.url }}" 2>&1 | tee /tmp/build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            {
              echo "::group::آخر ٦٠ سطراً من سجل البناء"
              tail -n 60 /tmp/build.log
              echo "::endgroup::"
            }
            # الأسطر المفيدة فقط — كي يرى المدير السبب بلا قراءة سجل ضخم
            grep -inE 'what went wrong|^\s*error|error:|failure:|failed|not found|could not|unable to|requires|exception|incompatible' \
              /tmp/build.log | tail -n 10 | while IFS= read -r l; do
              echo "::error title=فشل البناء::$(echo "$l" | cut -c1-220)"
            done
            exit "$rc"
          fi
          tail -n 3 /tmp/build.log

      # ─── التجهيز والنشر ───
      - name: تجهيز الملفات والبصمة
        id: pack
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -e
          # اسم المخرَج يختلف بحسب المعمارية: نسخة 64 بت تُسمّى
          # app-arm64-v8a-release.apk، والموحّدة app-release.apk
          ABI="${{ steps.ver.outputs.abifile }}"
          TYPE="${{ steps.ver.outputs.type }}"
          DIR="build/app/outputs/flutter-apk"
          if [ -n "$ABI" ]; then
            SRC="$DIR/app-$ABI-$TYPE.apk"
          else
            SRC="$DIR/app-$TYPE.apk"
          fi
          # احتياط: التقط أي ملف مطابق لو اختلف الاسم في إصدار Flutter آخر
          if [ ! -f "$SRC" ]; then
            SRC=$(ls -1 "$DIR"/app-*.apk 2>/dev/null | head -1 || true)
          fi
          [ -f "$SRC" ] || {
            echo "::error::لم يُنتج ملف APK — محتوى $DIR:"
            ls -la "$DIR" 2>&1 || true
            exit 1
          }
          echo "ملف المخرَج: $SRC"

          OUT="${{ steps.ver.outputs.apk }}"
          cp "$SRC" "$OUT"
          SIZE=$(stat -c%s "$OUT")
          SHA=$(sha256sum "$OUT" | cut -d' ' -f1)

          {
            echo "size=$SIZE"
            echo "sha=$SHA"
            echo "size_h=$(awk -v s=$SIZE 'BEGIN{printf "%.1f", s/1048576}')"
          } >> "$GITHUB_OUTPUT"

          {
            echo "الملف: $OUT"
            echo "الإصدار: ${{ steps.ver.outputs.name }} (بناء ${{ steps.ver.outputs.code }})"
            echo "النوع: ${{ steps.ver.outputs.type }}"
            echo "المعمارية: ${{ steps.ver.outputs.arch }}"
            echo "الخادم: ${{ steps.ver.outputs.url }}"
            echo "الحجم: $SIZE بايت"
            echo "SHA-256: $SHA"
            echo "الالتزام: ${{ github.sha }}"
          } > build-info.txt
          cat build-info.txt

      # ─── التحقق من التوقيع: بصمة المفتاح الذي وقّع الملف فعلاً ───
      # مهمّ لمتجر Google Play: يجب أن يكون الملف موقّعاً بمفتاحك لا بمفاتيح
      # التصحيح. تُطبع البصمة هنا فيصبح الأمر قابلاً للتأكد لا للافتراض.
      # ─── التحقق من رابط الخادم المخبوز في الحزمة ───
      # `--dart-define` يُخبز الرابط داخل libapp.so؛ فنتأكد قبل التسليم أن
      # الحزمة تخاطب الخادم المقصود فعلاً — وإلا خرجت نسخة تخاطب غيره بلا
      # أن يظهر ذلك في أي مكان. تنبيه لا فشل: نُبلّغ ولا نُسقط البناء.
      # موضعه بعد «تجهيز الملفات» لأن اسم الملف النهائي يُنشأ هناك.
      - name: التحقق من رابط الخادم داخل الحزمة
        if: ${{ steps.pack.outcome == 'success' }}
        working-directory: ${{ env.APP_DIR }}
        env:
          APK_FILE: ${{ steps.ver.outputs.apk }}
          WANT_URL: ${{ steps.ver.outputs.url }}
        run: |
          set +e
          python3 - <<'PY'
          import os, re, sys, zipfile

          apk = os.environ.get('APK_FILE', '')
          want = os.environ.get('WANT_URL', '')
          if not os.path.isfile(apk):
              print('::warning title=تعذّر التحقق::ملف الحزمة غير موجود: ' + apk)
              sys.exit(0)
          try:
              z = zipfile.ZipFile(apk)
              names = [n for n in z.namelist()
                       if n.startswith('lib/') and n.endswith('libapp.so')]
              if not names:
                  print('::warning title=تعذّر التحقق::لا يوجد libapp.so داخل ' + apk)
                  sys.exit(0)
              data = z.read(names[0])
          except Exception as exc:
              print('::warning title=تعذّر التحقق::' + str(exc))
              sys.exit(0)

          found = sorted({m.decode('utf-8', 'replace')
                          for m in re.findall(rb't3lam\.site/dalel[a-z]*', data)})
          print('الرابط المتوقّع: ' + want)
          print('الموجود في ' + names[0] + ': ' + (', '.join(found) or 'لم يُعثر على أي رابط'))
          # حدٌّ لاحق يمنع المطابقة بالبادئة: 'daleltest' تبدأ بـ'dalel'
          ok = bool(want) and re.search(
              re.escape(want).encode() + rb'(?![A-Za-z0-9])', data) is not None
          if ok:
              print('✅ الحزمة تخاطب الخادم المقصود: ' + want)
          else:
              print('::warning title=رابط الخادم غير مطابق::المتوقّع '
                    + want + ' — والموجود: ' + (', '.join(found) or 'لا شيء'))
          PY

      - name: التحقق من التوقيع
        id: sign
        if: always()
        working-directory: ${{ env.APP_DIR }}
        run: |
          set +e
          APK="${{ steps.ver.outputs.apk }}"
          [ -f "$APK" ] || { echo "تخطّي: لا ملف بعد"; exit 0; }

          APKSIGNER=$(ls -1 "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "::warning title=لا apksigner::تعذّر إيجاد apksigner للتحقق من التوقيع"
            exit 0
          fi

          OUT=$("$APKSIGNER" verify --print-certs "$APK" 2>&1)
          echo "$OUT"
          FP=$(echo "$OUT" | grep -i 'SHA-256 digest' | head -1 | sed 's/.*: //')
          CN=$(echo "$OUT" | grep -i 'certificate DN' | head -1 | sed 's/.*: //')

          if echo "$CN" | grep -qi 'Android Debug'; then
            echo "::warning title=توقيع التصحيح::الملف موقّع بمفاتيح التصحيح — يصلح للتجربة لا للنشر على Google Play. أضف KEYSTORE_BASE64 وسواها من الأسرار."
            echo "sig=debug" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=توقيع الإصدار::موقّع بمفتاح الإصدار: $CN"
            echo "sig=release" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "sig_cn=$CN"
            echo "sig_fp=$FP"
          } >> "$GITHUB_OUTPUT"

      - name: ملخّص التشغيل
        working-directory: ${{ env.APP_DIR }}
        run: |
          {
            echo "## ✅ حزمة أندرويد جاهزة — ${{ steps.ver.outputs.name }} (بناء ${{ steps.ver.outputs.code }})"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| الملف | \`${{ steps.ver.outputs.apk }}\` |"
            echo "| الحجم | ${{ steps.pack.outputs.size_h }} ميغا |"
            echo "| الخادم | \`${{ steps.ver.outputs.url }}\` |"
            echo "| النوع | ${{ steps.ver.outputs.type }} |"
            echo "| المعمارية | ${{ steps.ver.outputs.arch }} |"
            echo "| التوقيع | ${{ steps.sign.outputs.sig == 'release' && 'مفتاح إصدار ✅' || 'مفاتيح تصحيح ⚠️' }} |"
            echo "| SHA-256 | \`${{ steps.pack.outputs.sha }}\` |"
            echo ""
            echo "### نشره للتحديث من داخل التطبيق"
            echo ""
            echo "1. نزّل الملف من قسم **Artifacts** في هذه الصفحة."
            echo "2. ارفعه إلى موقعك (مجلد \`apk/\`) أو استعمل رابط الإصدار إن فعّلت «إنشاء إصدار GitHub»."
            echo "3. لوحة التحكم › **تحديث التطبيق**:"
            echo "   - الإصدار: \`${{ steps.ver.outputs.name }}\`"
            echo "   - رقم البناء: \`${{ steps.ver.outputs.code }}\`"
            echo "   - مسار الملف: \`apk/${{ steps.ver.outputs.apk }}\`"
            echo "4. احفظ — وسيظهر التنبيه لكل مستخدم نسخته أقدم."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: رفع الملف (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: dalel-apk-${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.code }}
          path: |
            ${{ env.APP_DIR }}/${{ steps.ver.outputs.apk }}
            ${{ env.APP_DIR }}/build-info.txt
          if-no-files-found: error
          retention-days: 90

      # ─── إصدار GitHub (رابط تحميل عام دائم) ───
      # يُنشأ بأداة gh الرسمية المتوفّرة على الخادم بدل إجراء طرف ثالث
      # (المهنة تملك صلاحية الكتابة، فالأولى عدم تمريرها لجهة خارجية).
      - name: إنشاء إصدار GitHub
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
        working-directory: ${{ env.APP_DIR }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag || format('v{0}-{1}', steps.ver.outputs.name, steps.ver.outputs.code) }}
          TITLE: ${{ format('دليل الدير {0} (بناء {1})', steps.ver.outputs.name, steps.ver.outputs.code) }}
          APK: ${{ steps.ver.outputs.apk }}
        run: |
          set -e
          cat > /tmp/notes.md <<EOF
          حزمة أندرويد جاهزة للتنزيل المباشر.

          - الإصدار: ${{ steps.ver.outputs.name }} (بناء ${{ steps.ver.outputs.code }})
          - الحجم: ${{ steps.pack.outputs.size_h }} ميغا
          - SHA-256: \`${{ steps.pack.outputs.sha }}\`

          للاستعمال في «تحديث التطبيق»: انسخ رابط الملف من هذه الصفحة والصقه في
          حقل «مسار الملف» أو «رابط خارجي» في لوحة التحكم.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --title "$TITLE" \
              --notes-file /tmp/notes.md --generate-notes
          fi
          echo "🔗 $(gh release view "$TAG" --json url -q .url)"
          echo "- رابط الإصدار: $(gh release view "$TAG" --json url -q .url)" >> "$GITHUB_STEP_SUMMARY"

      - name: تنظيف ملف التوقيع
        if: always()
        working-directory: ${{ env.APP_DIR }}/android
        run: rm -f dalel-release.jks key.properties
